name: TrenchRadar Windows exe

on:
  push:
    branches: [claude/trench-radar]
    paths: ["trench-radar/**", ".github/workflows/trench-radar-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: trench-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --clean TrenchRadar.spec
      - name: Smoke test (serves the dashboard)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          $env:DASHBOARD_PORT = "8899"
          $env:BROWSER = "none"
          $p = Start-Process dist\TrenchRadar.exe -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\exe-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\exe-err.txt"
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://127.0.0.1:8899/ -UseBasicParsing).Content -match "TRENCH//RADAR") { $ok = $true; break } } catch {}
          }
          # the fitted models must be live in the exe, not silently off
          if ($ok) {
            $ov = (Invoke-WebRequest http://127.0.0.1:8899/api/overview -UseBasicParsing).Content | ConvertFrom-Json
            if (-not $ov.edge_model) { Write-Host "launch-edge model is not loaded in the exe"; $ok = $false }
            Start-Sleep 3
            $log = (Get-Content "$env:RUNNER_TEMP\exe-out.txt", "$env:RUNNER_TEMP\exe-err.txt" -ErrorAction SilentlyContinue) -join "`n"
            if ($log -match "not installed|numpy C-extensions failed|model not loaded") { Write-Host "a bundled library failed to load in the exe"; $ok = $false }
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "---- exe stdout ----"; Get-Content "$env:RUNNER_TEMP\exe-out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
            Write-Host "---- exe stderr ----"; Get-Content "$env:RUNNER_TEMP\exe-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw "exe did not serve the dashboard"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TrenchRadar-windows
          path: trench-radar/dist/TrenchRadar.exe
          retention-days: 30
