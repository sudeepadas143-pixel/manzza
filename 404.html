<!doctype html>
<html lang="en-IN">
<head>
  {{> head page="notFound" path="/404" noindex="1"}}
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/main.js"></script>
</head>
<body class="page-404">
  {{> header}}
  <main id="main">
    <section class="phero phero--text phero--404">
      <div class="container">
        {{> eyebrow label="Page not found"}}
        <h1 class="h1">This page is not here.</h1>
        <p class="lead">The link may be out of date. These pages will help you find what you need.</p>
        <div class="btn-row">
          <a class="btn btn--primary" href="/">Go to the home page</a>
          <a class="btn btn--ghost" href="/quote">Request a Quote</a>
        </div>
      </div>
    </section>
  </main>
  {{> footer}}
</body>
</html>
