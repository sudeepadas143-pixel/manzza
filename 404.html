<!doctype html>
<html lang="en-IN">
<head>
  {{> head page="notFound" path="/404" noindex="1"}}
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/main.js"></script>
</head>
<body class="page-404">
  {{> header}}
  <main id="main" tabindex="-1">
    <section class="phero phero--404" data-atmos="phero">
      <div class="container">
        <h1 class="d-xxl" data-rise>Page not found</h1>
        <p class="body-lg phero__lede">The link may be out of date.</p>
        {{> pill href="/" label="Go to the home page"}}
      </div>
    </section>
  </main>
  {{> footer}}
</body>
</html>
