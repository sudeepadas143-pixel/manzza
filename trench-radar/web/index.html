<script>/* edition and display mode before first paint, so nothing flashes */
(function () { var d = document.documentElement; try {
  var e = localStorage.getItem("radar-edition") || "day"; d.dataset.edition = e;
  var m = localStorage.getItem("radar-perf") || "auto", n = navigator, c = n.connection || {};

    || (n.deviceMemory && n.deviceMemory <= 4) || (n.hardwareConcurrency && n.hardwareConcurrency <= 4);
  d.dataset.perf = m === "auto" ? (low ? "low" : "premium") : m;
  var tc = document.querySelector('meta[name="theme-color"]'); if (tc && e === "night") tc.content = "#121926"; } catch (x) {} })();</script>
