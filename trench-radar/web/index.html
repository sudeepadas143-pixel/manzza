<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body class="intro">
<div class="app">
  <nav class="nav" aria-label="Sections">
    <div class="brand">TRENCH<b>//</b>RADAR</div>
    <button class="tab" data-go="overview" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg><span>Overview</span></button>
    <button class="tab" data-go="metas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5.5-5.5"/><circle cx="12" cy="12" r=".6"/></svg><span>Metas</span></button>
    <button class="tab" data-go="tokens">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="1.6"/></svg><span>Tokens</span></button>
    <button class="tab" data-go="analyst">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg><span>Analyst</span></button>
    <button class="tab" data-go="system">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg><span>System</span></button>
  </nav>

  <div class="main">
    <header class="topbar" id="topbar">
      <span class="mark">T<b>//</b>R</span>
      <h1 id="title">Overview</h1>
      <span class="spacer"></span>
      <span class="live" id="live" role="status"><i></i><span>Loading</span></span>
      <button class="iconbtn" id="refresh" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </header>
    <div class="view">
      <div id="banner"></div>
      <section class="screen" data-screen="overview" aria-label="Overview"></section>
      <section class="screen" data-screen="metas" aria-label="Metas" hidden></section>
      <section class="screen" data-screen="tokens" aria-label="Tokens" hidden></section>
      <section class="screen" data-screen="analyst" aria-label="Analyst" hidden></section>
      <section class="screen" data-screen="system" aria-label="System" hidden></section>
    </div>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
  <div class="grab" id="grab"><i></i></div>
  <div class="head"><div><h2 id="sheet-title"></h2><div class="sub" id="sheet-sub"></div></div>
    <button class="close" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="body" id="sheet-body"></div>
</section>
<div class="tip" id="tip" role="tooltip"></div>
