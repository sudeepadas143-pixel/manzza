<!doctype html>
<html lang="en-IN">
<head>
  {{> head page="quote" path="/quote"}}
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/quote.js"></script>
</head>
<body class="page-quote">
  {{> header active="quote"}}

  <main id="main">
    <section class="phero" data-atmos="phero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li aria-current="page">Request a quote</li></ol></nav>
        <h1 class="d-xxl" data-rise>Request a quote</h1>
        <p class="body-lg phero__lede">Submit your requirements for an individual quotation.</p>
      </div>
    </section>

    <section class="section section--soft">
      <div class="container quote">
        <div class="quote__main">
          {{> quoteForm}}
        </div>
        {{> contactCard}}
      </div>
    </section>
  </main>

  {{> footer}}
</body>
</html>
